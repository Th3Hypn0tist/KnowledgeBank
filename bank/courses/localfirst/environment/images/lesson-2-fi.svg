us</tspan></text><rect x="55" y="218" width="250" height="60" rx="12" fill="#151b27" stroke="#47556a"/><text x="180" y="253" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="180" dy="0">Verkko</tspan></text><rect x="375" y="218" width="250" height="60" rx="12" fill="#151b27" stroke="#47556a"/><text x="500" y="253" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="500" dy="0">Palvelut</tspan></text><text transform="translate(0 -1)" x="340" y="343" text-anchor="middle" font-size="13" fill="#adb5c3"><tspan x="340" dy="0">Resurssit palvelevat määriteltyjä paikallisia toimintoja.</tspan></text></g></svg>