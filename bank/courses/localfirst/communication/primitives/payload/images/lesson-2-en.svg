<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 365" role="img"><title>Payload minimization</title><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#42bcff"/></marker><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#f451af"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#ffae63"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#78d9a4"/></marker></defs><rect width="680" height="365" rx="12" fill="#10141d"/><g font-family="system-ui,sans-serif"><text x="24" y="30" font-size="16" font-weight="700" fill="#adb5c3">Payload minimization</text><rect x="20" y="58" width="310" height="244" rx="15" fill="none" stroke="#f451af" stroke-width="1.5" stroke-dasharray="7 5"/><text x="32" y="81" font-size="13" fill="#f451af">Available source data</text><path d="M310 128H375" fill="none" stroke="#78d9a4" stroke-width="2.5" marker-end="url(#green)"/><path d="M310 243H355" fill="none" stroke="#ffae63" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="40" y="100" width="270" height="56" rx="12" fill="#151b27" stroke="#47556a"/><text x="175" y="133" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="175" dy="0">Identifiers + action</tspan></text><rect x="40" y="210" width="270" height="66" rx="12" fill="#151b27" stroke="#47556a"/><text x="175" y="248" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="175" dy="0">Other data</tspan></text><rect x="375" y="100" width="280" height="56" rx="12" fill="#151b27" stroke="#47556a"/><text x="515" y="133" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="515" dy="0">Required message</tspan></text><rect x="375" y="210" width="280" height="66" rx="12" fill