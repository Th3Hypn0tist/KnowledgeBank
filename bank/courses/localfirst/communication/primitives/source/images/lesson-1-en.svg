<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img"><title>The user is not the message source</title><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#42bcff"/></marker><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#f451af"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#ffae63"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#78d9a4"/></marker></defs><rect width="680" height="370" rx="12" fill="#10141d"/><g font-family="system-ui,sans-serif"><text x="24" y="30" font-size="16" font-weight="700" fill="#adb5c3">The user is not the message source</text><path d="M210 162H247" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M432 162H470" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="25" y="120" width="185" height="85" rx="12" fill="#151b27" stroke="#47556a"/><text x="117.5" y="157.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="117.5" dy="0">User</tspan><tspan x="117.5" dy="21">initiates</tspan></text><rect x="247" y="120" width="185" height="85" rx="12" fill="#151b27" stroke="#47556a"/><text x="339.5" y="157.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="339.5" dy="0">Application</tspan><tspan x="339.5" dy="21">produces message</tspan></text><rect x="470" y="120" width="185" height="85" rx="12" fill="#151b27" stroke="#47556a"/><text x="562.5" y="167.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="562.5" dy="0">Maintenance service</tspan></text><text x="340" y="343" text-anchor="middle" font-size="13" fill="#adb5c3"><tspan x="340" dy="0">At this level the application process is