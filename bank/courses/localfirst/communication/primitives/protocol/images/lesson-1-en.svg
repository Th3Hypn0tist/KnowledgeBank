<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img"><title>Example protocol layers</title><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#42bcff"/></marker><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#f451af"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#ffae63"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#78d9a4"/></marker></defs><rect width="680" height="370" rx="12" fill="#10141d"/><g font-family="system-ui,sans-serif"><text x="24" y="30" font-size="16" font-weight="700" fill="#adb5c3">Example protocol layers</text><path d="M340 112V125" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M340 175V188" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M340 238V251" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="95" y="62" width="490" height="50" rx="12" fill="#151b27" stroke="#47556a"/><text x="340" y="92" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="340" dy="0">HTTP · application messaging</tspan></text><rect x="95" y="125" width="490" height="50" rx="12" fill="#151b27" stroke="#47556a"/><text x="340" y="155" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="340" dy="0">TCP · transport</tspan></text><rect x="95" y="188" width="490" height="50" rx="12" fill="#151b27" stroke="#47556a"/><text x="340" y="218" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="340" dy="0">IP · addressing and routing</tspan></text><rect x="95" y="251" width="490" height="50" rx="12" fill="#151b27" stroke="#47556a"/><text x="340" y="281" text-anchor="middle" font-size