<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img"><title>Evidence and its protection</title><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#42bcff"/></marker><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#f451af"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#ffae63"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#78d9a4"/></marker></defs><rect width="680" height="370" rx="12" fill="#10141d"/><g font-family="system-ui,sans-serif"><text x="24" y="32" font-size="20" font-weight="700" fill="#f2f4f8">Evidence and its protection</text><path d="M215 97H245V150H275" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M215 187H275" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M215 277H245V205H275" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="25" y="65" width="190" height="65" rx="12" fill="#151b27" stroke="#47556a"/><text x="120" y="92.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="120" dy="0">Knowledge</tspan><tspan x="120" dy="21">e.g. password</tspan></text><rect x="25" y="155" width="190" height="65" rx="12" fill="#151b27" stroke="#47556a"/><text x="120" y="182.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="120" dy="0">Possession</tspan><tspan x="120" dy="21">e.g. security key</tspan></text><rect x="25" y="245" width="190" height="65" rx="12" fill="#151b27" stroke="#47556a"/><text x="120" y="272.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="120" dy="0">Inherence</tspan><tspan x="120" dy="21">e.g. biometrics</tspan></text><rect x="275" y="130" width="380" height="95" rx="12" fill="#151b27" stroke="#47556a"/><text x="465" y="172.5" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="465" dy="0">Authentication policy</tspan><tspan x="465" dy="21">Required factors</tspan></text><text x="340" y="343" text-anchor="middle" font-size="13" fill="#adb5c3"><tspan x="340" dy="0">Two passwords do not constitute two distinct factor types.</tspan></text></g></svg>