<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img"><title>A process boundary isolates execution</title><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#42bcff"/></marker><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#f451af"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#ffae63"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#78d9a4"/></marker></defs><rect width="680" height="370" rx="12" fill="#10141d"/><g font-family="system-ui,sans-serif"><text x="24" y="32" font-size="20" font-weight="700" fill="#f2f4f8">A process boundary isolates execution</text><rect x="18" y="58" width="644" height="245" rx="15" fill="none" stroke="#f451af" stroke-width="1.5" stroke-dasharray="7 5"/><text x="30" y="81" font-size="13" fill="#f451af">One server, separate processes</text><path d="M220 150H250" fill="none" stroke="#78d9a4" stroke-width="2.5" marker-end="url(#green)"/><path d="M430 150H460" fill="none" stroke="#78d9a4" stroke-width="2.5" marker-end="url(#green)"/><path d="M550 190V235" fill="none" stroke="#42bcff" stroke-width="2.5" marker-end="url(#blue)" marker-start="url(#blue)"/><path d="M130 190V260H440" fill="none" stroke="#ffae63" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="40" y="110" width="180" height="80" rx="12" fill="#151b27" stroke="#47556a"/><text x="130" y="155" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="130" dy="0">Import process</tspan></text><rect x="250" y="110" width="180" height="80" rx="12" fill="#151b27" stroke="#47556a"/><text x="340" y="155" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="340" dy="0">Application process</tspan></text><rect x="460" y="110" width="180" height="80" rx="12" fill="#151b27" stroke="#47556a"/><text x="550" y="155" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="550" dy="0">Database process</tspan></text><rect x="460" y="235" width="180" height="50" rx="12" fill="#151b27" stroke="#47556a"/><text x="550" y="265" text-anchor="middle" font-size="16" fill="#f2f4f8"><tspan x="550" dy="0">Storage files</tspan></text><text x="340" y="343" text-anchor="middle" font-size="13" fill="#adb5c3"><tspan x="340" dy="0">The import process does not need direct storage access.</tspan></text></g></svg>